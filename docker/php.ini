; PHP en producción (Clínica Vida Salud)
expose_php = Off
memory_limit = 256M
max_execution_time = 60

; CU04: carga de usuarios por lotes (CSV/Excel)
upload_max_filesize = 10M
post_max_size = 12M

; Zona horaria de respaldo (la aplicación usa APP_TIMEZONE)
date.timezone = America/La_Paz

; OPcache: el código no cambia dentro del contenedor
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
